{% extends 'school_app/base.html' %}
{% block content %}
<div class="card">
  <h1>Teacher Dashboard</h1>
  <h2>My Classes</h2>
  <ul>
    {% for c in classes %}
      <li>
        {{ c.name }} —
        <a class="link" href="{% url 'mark_attendance' c.id %}">Mark Attendance</a>
        <a class="link" href="{% url 'enter_grades' c.id %}">Enter Grades</a>
      </li>
    {% endfor %}
  </ul>
</div>

<div class="card">
  <h2>Attendance Rate by Class</h2>
  <canvas id="attendanceChart" height="120"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
  const labels = [{% for a in attendance_summary %}"{{ a.name }}",{% endfor %}];
  const rates = [{% for a in attendance_summary %}{{ a.rate }},{% endfor %}];

  new Chart(document.getElementById('attendanceChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{ label: 'Attendance %', data: rates, backgroundColor: '#2563eb' }]
    },
    options: { scales: { y: { beginAtZero: true, max: 100 } } }
  });
</script>
{% endblock %}
